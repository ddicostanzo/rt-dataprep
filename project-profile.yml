project: rt-dataprep
stack: python
commands:
  build: uv run --group dev python -m compileall -q src
  test: uv run --group dev pytest -q --tb=short
  lint: uv run --group dev ruff check .
merge: squash
branches:
  target: main
execution:
  max_parallel_worktrees: 1
compliance:
  - name: phi
    rules:
      - "No PatientID, name, date of birth or path in log lines or exception messages. Under the output root, organize_report.csv / convert_report.csv / preprocess_report.csv (and their dated per-run copies, <name>_<UTC time>.csv) carry the sanitized id, and per-folder series.json files and plan.parquet carry per-file metadata (sanitized id, dates, plan label, SeriesDescription, UIDs; plan.parquet holds the treatment machine, beam names and the isocenter); none of these is ever committed. Likewise manifest.jsonl (and its dated copies, manifest_<UTC time>.jsonl) and splits.json carry the sanitized id; they are written under the data root and never committed."
      - "Reports and logs are written under the output root only, never the working directory."
      - "Test data is synthetic, generated at test time; no .dcm or imaging files are committed."
  - name: data-safety
    rules:
      - "Source DICOM trees are only read, never moved, renamed or deleted."
review:
  - "Refusal reasons are fixed string constants."
  - "pydicom reads are quieted for the whole access, not just dcmread (vault: pydicom-validates-lazily-on-first-tag-access)."
