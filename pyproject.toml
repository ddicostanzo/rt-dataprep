[project]
name = "rt-dataprep"
version = "0.1.0"
description = "Turn radiotherapy DICOM exports into ML-ready cases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydicom>=3", "numpy"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rt_dataprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff.lint]
# Pinned: ruff 0.17's built-in default is far wider than the old one. Correctness rules, not style.
select = ["E4", "E7", "E9", "F", "B"]
