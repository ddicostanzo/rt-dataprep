[project]
name = "rt-dataprep"
version = "0.3.0"
description = "Turn radiotherapy DICOM exports into ML-ready cases"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydicom>=3",
    "numpy",
    "simpleitk>=2.5.7",
    "dicomrttool==6.2.0",
    "scikit-image>=0.26.0",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
rt-dataprep = "rt_dataprep.__main__:main"

[project.urls]
Repository = "https://github.com/ddicostanzo/rt-dataprep"
Issues = "https://github.com/ddicostanzo/rt-dataprep/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Session notes stay local even when untracked files sit in the tree.
exclude = ["docs/handoffs"]

[tool.hatch.build.targets.wheel]
packages = ["src/rt_dataprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: full-size runs, excluded by default (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff.lint]
# Pinned: ruff 0.17's built-in default is far wider than the old one. Correctness rules, not style.
select = ["E4", "E7", "E9", "F", "B"]
