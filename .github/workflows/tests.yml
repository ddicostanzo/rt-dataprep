# Runs the checks of CONTRIBUTING.md "Verify" on every pull request and on main. Tests use synthetic data only.
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"  # the oldest supported (requires-python)
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q --tb=short
